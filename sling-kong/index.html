}

/* ===================== שינוי גודל + איכות אדפטיבית ===================== */
function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, dprCap);
  cvs.width = Math.round(W * DPR); cvs.height = Math.round(H * DPR);
  BGR = Math.min(DPR, 1.5);
  baseScale = H / CFG.VIEW_H;
  buildBackground();
  const portrait = H > W && isTouch;
  $('rotate').classList.toggle('show', portrait);
  if (portrait && state === 'play') pauseGame();
}
let resizeTimer = 0;
function queueResize() { clearTimeout(resizeTimer); resizeTimer = setTimeout(resize, 120); }
window.addEventListener('resize', queueResize);
window.addEventListener('orientationchange', queueResize);

// אם הטלפון מתקשה — מורידים רזולוציה כדי לשמור על 60fps
const perf = { acc: 0, n: 0, downgrades: 0 };
function perfMonitor(fdt) {
  if (state !== 'play') { perf.acc = 0; perf.n = 0; return; }
  perf.acc += fdt; perf.n++;
  if (perf.n >= 120) {
    const avg = perf.acc / perf.n;
    if (avg > 0.022 && perf.downgrades < 2 && dprCap > 1) { dprCap = Math.max(1, dprCap - 0.5); perf.downgrades++; resize(); }
    perf.acc = 0; perf.n = 0;
  }
}

/* ===================== קלט — לחיצה אחת בכל מקום ===================== */
function onDown(e) {
  Sound.unlock();
  if (e.target.closest && (e.target.closest('.ui-btn') || e.target.closest('.screen'))) return;
  if (e.cancelable) e.preventDefault();
  input.pointers.add(e.pointerId);
  if (!input.down) {
    input.down = true;
    if (state === 'play') { input.pressT = G.t; G.player.autoHold = false; }
  }
}
function onUp(e) {
  input.pointers.delete(e.pointerId);
  if (input.pointers.size === 0) input.down = false;
}
window.addEventListener('pointerdown', onDown, { passive: false });
window.addEventListener('pointerup', onUp);
window.addEventListener('pointercancel', onUp);
window.addEventListener('blur', () => { input.pointers.clear(); input.down = false; });
// מניעת זום, גלילה, תפריט הקשה ובחירת טקסט
const notBtn = e => !(e.target.closest && e.target.closest('.ui-btn'));
document.addEventListener('touchstart', e => { if (notBtn(e)) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', e => { Sound.unlock(); if (notBtn(e)) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('selectstart', e => e.preventDefault());
// מקלדת (לבדיקה במחשב): רווח = החזקה
window.addEventListener('keydown', e => {
  if (e.code === 'Space' && !e.repeat) { onDown({ target: document.body, pointerId: 'kb', cancelable: false }); e.preventDefault(); }
  if (e.code === 'Escape' || e.code === 'KeyP') { if (state === 'play') pauseGame(); else if (state === 'paused') resumeGame(); }
});
window.addEventListener('keyup', e => { if (e.code === 'Space') onUp({ pointerId: 'kb' }); });

/* ===================== ממשק ומצבי משחק ===================== */
function showScreen(id) {
  for (const s of ['menu', 'pause', 'over']) $(s).classList.toggle('show', s === id);
}
function goFullscreen() {
  try {
    const el = document.documentElement;
    if (!document.fullscreenElement && el.requestFullscreen) {
      el.requestFullscreen({ navigationUI: 'hide' }).then(() => {
        if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { });
      }).catch(() => { });
    }
  } catch (e) { }
}
function startGame() {
  Sound.unlock(); Sound.fx.click();
  newWorld();
  state = 'play';
  input.down = false; input.pointers.clear(); input.pressT = -999;
  lastHud = { score: -1, ban: -1, mult: -1 };
  $('hud-best').textContent = 'שיא ' + best;
  showScreen(null);
  $('hud').classList.add('show');
  $('btn-pause').classList.add('show');
  $('hint').classList.toggle('show', firstRun);
  G.hintShown = !firstRun;
  firstRun = false;
  Sound.music(0.42); Sound.slow(false);
}
function pauseGame() {
  if (state !== 'play') return;
  state = 'paused';
  showScreen('pause');
  $('btn-pause').classList.remove('show');
  Sound.music(0); Sound.slow(false);
}
function resumeGame() {
  if (state !== 'paused') return;
  if (H > W && isTouch) return;
  Sound.unlock();
  state = 'play';
  input.down = false; input.pointers.clear(); input.pressT = -999;
  // אחרי פאוז הגורילה נתפסת אוטומטית עד הלחיצה הבאה — כדי לא ליפול מייד
  if (G.player.attached) G.player.autoHold = true;
  showScreen(null);
  $('btn-pause').classList.add('show');
  Sound.music(0.42); if (G.power.slow > 0) Sound.slow(true);
  lastFrame = performance.now();
}
function toMenu() {
  newWorld();
  state = 'menu';
  showScreen('menu');
  $('hud').classList.remove('show');
  $('btn-pause').classList.remove('show');
  $('menu-best').textContent = best;
  Sound.music(0.3); Sound.slow(false);
}
let overReadyAt = 0;
function gameOver() {
  state = 'over';
  const score = G.score, isBest = score > best;
  if (isBest) { best = score; store.set('slingkong_best', String(best)); Sound.fx.record(); }
  $('over-title').textContent = G.deathBy === 'water' ? 'נפלתם לנהר! 🌊' : G.deathBy === 'bird' ? 'התנגשתם בציפור! 🐦' : 'אאוץ׳, קוצים! 🌵';
  $('final-score').textContent = score;
  $('final-dist').textContent = G.dist || 0;
  $('final-ban').textContent = G.bananaCount;
  $('final-best').textContent = best;
  $('new-best').classList.toggle('show', isBest);
  $('hud').classList.remove('show');
  showScreen('over');
  overReadyAt = performance.now() + 500;   // מונע לחיצה בטעות על "שוב"
  Sound.music(0.22); Sound.slow(false);
}

function bindBtn(id, fn) {
  $(id).addEventListener('click', e => { e.stopPropagation(); Sound.unlock(); fn(); });
}
// לחיצה בכל מקום בתפריט מתחילה משחק
$('menu').addEventListener('pointerdown', e => {
  if (state !== 'menu') return;
  e.preventDefault(); goFullscreen(); startGame();
});
bindBtn('btn-play', () => { if (state === 'menu') { goFullscreen(); startGame(); } });
bindBtn('btn-pause', () => { Sound.fx.click(); pauseGame(); });
bindBtn('btn-resume', () => { Sound.fx.click(); resumeGame(); });
bindBtn('btn-restart-p', () => startGame());
bindBtn('btn-menu-p', () => { Sound.fx.click(); toMenu(); });
bindBtn('btn-again', () => { if (performance.now() > overReadyAt) startGame(); });
bindBtn('btn-menu-o', () => { if (performance.now() > overReadyAt) { Sound.fx.click(); toMenu(); } });
bindBtn('btn-mute', () => { Sound.toggleMute(); updateMuteIcon(); Sound.fx.click(); });
function updateMuteIcon() {
  $('btn-mute').innerHTML = Sound.muted
    ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>'
    : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>';
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { pauseGame(); Sound.suspend(); }
  else Sound.resume();
});

/* ===================== לולאה ראשית: fixed timestep + accumulator ===================== */
let lastFrame = performance.now(), acc = 0;
function frame(now) {
  requestAnimationFrame(frame);
  let fdt = (now - lastFrame) / 1000; lastFrame = now;
  if (!(fdt > 0)) fdt = 0; if (fdt > 0.1) fdt = 0.1;
  perfMonitor(fdt);
  let alpha = 1;
  if (state === 'play' || state === 'menu' || state === 'dying') {
    const target = state === 'dying' ? 0.55 : (G.power.slow > 0 ? CFG.SLOW_SCALE : 1);
    G.timeScale += (target - G.timeScale) * (1 - Math.exp(-8 * fdt));
    acc += fdt * G.timeScale;
    let steps = 0;
    while (acc >= DT && steps < CFG.MAX_STEPS) { step(DT); acc -= DT; steps++; }
    if (steps >= CFG.MAX_STEPS) acc = 0;
    alpha = acc / DT;
    updateFrame(fdt, alpha);
  } else if (state === 'over') {
    // ברקע של מסך הסיום העולם ממשיך לנשום
    updateParticles(fdt * 0.5);
  }
  render(alpha);
}

/* ===================== אתחול ===================== */
buildSprites();
resize();
initAmbient();
newWorld();
updateMuteIcon();
$('menu-best').textContent = best;
requestAnimationFrame(frame);
</script>
</body>
</html>
