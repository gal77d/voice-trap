<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Trap - מלכודת קולית</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent: #22c55e;
            --accent-hover: #16a34a;
            --danger: #ef4444;
            --warning: #f59e0b;
            --text: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 4px;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .camera-container {
            position: relative;
            width: 100%;
            height: 220px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }

        .camera-container.motion-detected {
            border-color: var(--danger);
        }

        video, canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        canvas {
            display: none;
        }

        .status-badge {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.7);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
        }

        .dot.active {
            background: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }

        label {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        textarea {
            width: 100%;
            height: 80px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: var(--text);
            padding: 10px;
            font-size: 1rem;
            resize: none;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .controls-row {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        button.stop {
            background-color: var(--danger);
        }

        button.silence {
            background-color: var(--warning);
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
        }

        .log-box {
            background: #0f172a;
            border-radius: 8px;
            padding: 8px 12px;
            font-family: monospace;
            font-size: 0.8rem;
            color: var(--text-secondary);
            height: 60px;
            overflow-y: auto;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>voice-trap 🚨</h1>
        
        <div class="card">
            <div class="camera-container" id="cameraBox">
                <div class="status-badge">
                    <div id="statusDot" class="dot"></div>
                    <span id="statusText">ממתין להפעלה</span>
                </div>
                <video id="webcam" autoplay playsinline muted></video>
                <canvas id="canvasOutput"></canvas>
            </div>
            <div class="controls-row">
                <button id="toggleBtn" onclick="toggleSystem()">הפעל מלכודת</button>
                <button onclick="testSpeech()" style="background: #3b82f6;">בדיקת קול</button>
            </div>
            <div class="controls-row">
                <button class="silence" onclick="stopAudioOnly()">שקט / עצור קול 🔇</button>
            </div>
        </div>

        <div class="card">
            <label for="trapText">מה הצעקה/הדיבור שהמלכודת תגיד?</label>
            <textarea id="trapText">מי שם?! תעוף מפה מיד!</textarea>
            
            <div class="slider-group">
                <label>רגישות תנועה (<span id="sensVal">25</span>)</label>
                <input type="range" id="sensitivity" min="10" max="60" value="25" oninput="document.getElementById('sensVal').innerText = this.value">
            </div>
        </div>

        <div class="log-box" id="logBox">
            > מערכת מוכנה. הצב את הטלפון מול השטח ולחץ הפעלה.
        </div>
    </div>

    <script>
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('canvasOutput');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const toggleBtn = document.getElementById('toggleBtn');
        const logBox = document.getElementById('logBox');
        const cameraBox = document.getElementById('cameraBox');

        let isRunning = false;
        let isArmed = false;
        let lastFrameData = null;
        let animationFrameId = null;
        let lastTriggerTime = 0;
        let stream = null;
        let countdownTimer = null;
        let recognition = null;

        function log(msg) {
            logBox.innerHTML = `> ${msg}<br>` + logBox.innerHTML;
        }

        async function toggleSystem() {
            if (!isRunning) {
                try {
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        const dummy = new SpeechSynthesisUtterance(" ");
                        dummy.volume = 0;
                        window.speechSynthesis.speak(dummy);
                    }

                    // הפעלת מצלמה (ללא סאונד במיקרופון של הווידאו כדי למנוע פידבק)
                    stream = await navigator.mediaDevices.getUserMedia({ 
                        video: { facingMode: 'environment', width: 320, height: 240 }, 
                        audio: false 
                    });
                    video.srcObject = stream;
                    await video.play();
                    
                    // הפעלת זיהוי קול (Speech Recognition) ברקע
                    setupVoiceRecognition();

                    isRunning = true;
                    isArmed = false;
                    toggleBtn.innerText = "עצור מלכודת";
                    toggleBtn.classList.add('stop');
                    
                    canvas.width = 160;
                    canvas.height = 120;
                    lastFrameData = null;
                    
                    // דיליי של 7 שניות דריכה
                    let timeLeft = 7;
                    statusText.innerText = `התרחק מהשטח (${timeLeft})...`;
                    log(`הפעלת טיימר: המלכודת תדרוך בעוד ${timeLeft} שניות.`);

                    countdownTimer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft > 0) {
                            statusText.innerText = `התרחק מהשטח (${timeLeft})...`;
                        } else {
                            clearInterval(countdownTimer);
                            isArmed = true;
                            statusDot.classList.add('active');
                            statusText.innerText = "המלכודת דרוכה (תנועה + קול)";
                            log("הצלחה: המלכודת דרוכה ומאזינה בשטח.");
                            detectMotion();
                        }
                    }, 1000);

                } catch (err) {
                    log("שגיאה בהפעלת מצלמה: " + err.message);
                    alert("ודא שהרשאת המצלמה מאושרת בדפדפן.");
                }
            } else {
                stopSystem();
            }
        }

        function setupVoiceRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.lang = 'he-IL';
                recognition.continuous = true;
                recognition.interimResults = false;

                recognition.onresult = (event) => {
                    if (!isArmed) return;
                    const transcript = event.results[event.results.length - 1][0].transcript.toLowerCase();
                    log(`שמעתי: "${transcript}"`);

                    // בדיקה האם נאמר "חשין שחור" (גם עם שגיאות כתיב קלות או מילים דומות)
                    if (transcript.includes('חשין שחור') || transcript.includes('חישין שחור') || transcript.includes('חשין')) {
                        const now = Date.now();
                        if (now - lastTriggerTime > 4000) {
                            lastTriggerTime = now;
                            log("🎙️ זיהוי קולי: נאמר 'חשין שחור'!");
                            cameraBox.classList.add('motion-detected');
                            setTimeout(() => cameraBox.classList.remove('motion-detected'), 1000);
                            triggerAlarm();
                        }
                    }
                };

                recognition.onerror = (event) => {
                    // התעלמות משגיאות שקט אוטומטיות והפעלה מחדש אם המערכת רצה
                    if (isRunning && event.error === 'no-speech') {
                        try { recognition.start(); } catch(e){}
                    }
                };

                recognition.onend = () => {
                    // שמירה על האזנה רציפה כל עוד המלכודת פעילה
                    if (isRunning) {
                        try { recognition.start(); } catch(e){}
                    }
                };

                try {
                    recognition.start();
                    log("מיקרופון מואזן: מחכה לקוד 'חשין שחור'...");
                } catch(e) {
                    log("שגיאה בהפעלת זיהוי קולי.");
                }
            } else {
                log("הערה: דפדפן זה אינו תומך בזיהוי קולי (SpeechRecognition). עובד רק לפי מצלמה.");
            }
        }

        function stopSystem() {
            isRunning = false;
            isArmed = false;
            if (countdownTimer) clearInterval(countdownTimer);
            if (recognition) {
                try { recognition.stop(); } catch(e){}
            }
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }
            video.srcObject = null;
            toggleBtn.innerText = "הפעל מלכודת";
            toggleBtn.classList.remove('stop');
            statusDot.classList.remove('active');
            statusText.innerText = "ממתין להפעלה";
            cameraBox.classList.remove('motion-detected');
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
            }
            log("המלכודת כובתה.");
        }

        function stopAudioOnly() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                log("הקול הושתק ידנית.");
            }
        }

        function detectMotion() {
            if (!isRunning || !isArmed) return;

            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            const currentFrame = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = currentFrame.data;

            if (lastFrameData) {
                let diffPixels = 0;
                const sensitivityInput = parseInt(document.getElementById('sensitivity').value);
                const pixelThreshold = 50; 

                for (let i = 0; i < data.length; i += 16) {
                    const rDiff = Math.abs(data[i] - lastFrameData.data[i]);
                    const gDiff = Math.abs(data[i+1] - lastFrameData.data[i+1]);
                    const bDiff = Math.abs(data[i+2] - lastFrameData.data[i+2]);

                    if ((rDiff + gDiff + bDiff) / 3 > pixelThreshold) {
                        diffPixels++;
                    }
                }

                if (diffPixels > sensitivityInput) {
                    const now = Date.now();
                    if (now - lastTriggerTime > 4000) {
                        lastTriggerTime = now;
                        
                        cameraBox.classList.add('motion-detected');
                        setTimeout(() => cameraBox.classList.remove('motion-detected'), 1000);

                        triggerAlarm();
                    }
                }
            }

            setTimeout(() => {
                if (isRunning && isArmed) {
                    lastFrameData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    animationFrameId = requestAnimationFrame(detectMotion);
                }
            }, 150); 
        }

        function triggerAlarm() {
            log("🚨 מפעיל צעקה איטית ועוצמתית!");
            
            const textToSpeak = document.getElementById('trapText').value || "זהירות! תתרחק מפה!";
            
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();

                for (let i = 0; i < 2; i++) {
                    const utterance = new SpeechSynthesisUtterance(textToSpeak);
                    utterance.lang = 'he-IL';
                    utterance.rate = 0.75; // איטי במיוחד
                    utterance.pitch = 0.5; // טון נמוך ומאיים
                    utterance.volume = 1.0; // מקסימלי
                    window.speechSynthesis.speak(utterance);
                }
            } else {
                log("שגיאה: אין תמיכה בדיבור בדפדפן.");
            }
        }

        function testSpeech() {
            const textToSpeak = document.getElementById('trapText').value || "בדיקת קול.";
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(textToSpeak);
                utterance.lang = 'he-IL';
                utterance.rate = 0.75;
                utterance.pitch = 0.5;
                utterance.volume = 1.0;
                window.speechSynthesis.speak(utterance);
                log("בוצעה בדיקת קול איטית ועוצמתית.");
            } else {
                alert("אין תמיכה בדיבור בדפדפן זה.");
            }
        }
    </script>
</body>
</html>
